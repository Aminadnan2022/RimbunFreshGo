<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#196848" />
    <title>FreshGo is offline</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
      body { align-items: center; background: #faf8f2; color: #1c1c1c; display: flex; justify-content: center; margin: 0; min-height: 100dvh; padding: 24px; box-sizing: border-box; }
      main { max-width: 360px; text-align: center; }
      img { border-radius: 24px; height: 72px; margin-bottom: 18px; width: 72px; }
      h1 { color: #134530; font-size: 24px; margin: 0 0 10px; }
      p { color: #5d635f; line-height: 1.5; margin: 0 0 20px; }
      button { background: #196848; border: 0; border-radius: 16px; color: white; cursor: pointer; font: inherit; font-weight: 600; padding: 12px 18px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/freshgo-192.png" alt="FreshGo" />
      <h1>You’re offline</h1>
      <p>Reconnect to the internet to continue using FreshGo. Your account and order data are never stored for offline access.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
